  /v1/sales-orders/bulk-update-settlement-status:
    post:
      description: "items move counter (offline) orders between settlement states,
        posting or reversing their sales journal; they can also move a settled
        online order back to pending/credit (voiding its payout) or cancel it.
        payouts settle online orders: each is one marketplace transfer for
        orders of one sales channel and outlet, posted as one receive payment (D
        bank for received_amount, D the channel's fee account for the rest, K
        the channel's receivable)."
      operationId: bulkUpdateSalesOrderSettlementStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateSettlementStatusRequest"
        required: true
      responses:
