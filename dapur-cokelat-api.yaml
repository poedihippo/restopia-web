      operationId: getArAging
      parameters:
        - description: Earliest document date (YYYY-MM-DD). Omit for every open receivable
            up to end_date.
          in: query
          name: start_date
          required: false
          schema:
            example: 2026-10-01
            format: date
            type: string
        - description: Report date (YYYY-MM-DD); documents are aged as of this date.
            Defaults to as_of_date, then today.
          in: query
          name: end_date
          required: false
          schema:
            example: 2026-10-31
            format: date
            type: string
        - description: Deprecated alias of end_date.
          in: query
          name: as_of_date
          required: false
          schema:
            example: 2026-10-31
            format: date
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: "#/components/schemas/ArAgingResponse"
                type: object
          description: Success
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Accounts Receivable Aging
      tags:
        - Reports
