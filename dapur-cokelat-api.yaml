  /v1/product-uoms/stock-position:
    get:
      description: Product UOMs enriched with the current branch's inbound
        purchase-order, delivery and receipt quantities plus the quantity each
        receiving branch got from the current branch for the product UOM.
        filter[start_date] and filter[end_date] are required (inclusive,
        YYYY-MM-DD) and window every aggregate. Purchase orders count
        type=branch in any status except pending/rejected; deliveries count
        final deliveries with packed details; receipts count final receipts with
        successful details. total_in_branches lists each branch that received
        the product UOM from the active branch in the window and reports the
        received quantity in total_stock; summing total_stock per product UOM
        equals total_received. Only product UOMs whose branch_types include the
        active branch's type and whose total_incoming_po in the window is
        greater than zero are returned. The product and uom includes are always
        resolved.
