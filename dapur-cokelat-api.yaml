          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "422":
          description: Unprocessable Entity
        "500":
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Bulk Update Sales Order Settlement Status
      tags:
        - Sales Orders
  /v1/sales-orders/checkout:
    post:
      description: "A counter (offline) sale needs at least one tender and is settled
        at once. An online sale (GoFood, Grab Food, ...) must send no payments:
        it stays pending as a receivable from the marketplace until its payout
        is settled through bulk-update-settlement-status. Both post the revenue
        + HPP journal at sale."
