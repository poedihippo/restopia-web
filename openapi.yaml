openapi: 3.0.0
info:
  title: Dapur Cokelat API
  description: >-
    REST API for Dapur Cokelat — a multi-branch bakery management platform.
    Covers authentication, user/role management, inventory, production,
    procurement (purchase orders, deliveries, receipts), sales orders, vouchers,
    payments, and AI queries.


    All protected endpoints require a Bearer token obtained from `POST
    /v1/auth/token`. Pass the token in the `Authorization` header as `Bearer
    <access_token>`.


    **Common query conventions**

    - Pagination: `page` (default 1) and `per_page` (default 10)

    - Eager-loading relations: `include=relation1,relation2`

    - Sorting: `sort=field` for ASC, `sort=-field` for DESC

    - Filtering: `filter[field]=value`
  version: 1.0.0
  contact:
    name: Dapur Cokelat Engineering
servers:
  - url: '{base_url}'
    description: Configurable base URL (set via environment variable)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: auth > token
  - name: ai
  - name: dashboard
  - name: enums
  - name: companies
  - name: branches
  - name: permissions
  - name: roles
  - name: users
  - name: media
  - name: product-categories
  - name: products
  - name: uoms
  - name: product-conversions
  - name: product-uoms
  - name: product-uom-batches
  - name: bundles
  - name: product-inventories
  - name: stock-movements
  - name: recipes
  - name: productions
  - name: suppliers
  - name: purchase-orders
  - name: deliveries
  - name: receipts
  - name: customers
  - name: vouchers
  - name: sales-orders
  - name: payment-methods
  - name: payments
paths:
  /v1/auth/token:
    post:
      tags:
        - auth > token
      summary: get token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: superadmin@gmail.com
                password: '!AMR00T'
      responses:
        '200':
          description: Successful response
          content:
