openapi: 3.0.3

info:
  title: Dapur Cokelat API
  description: >
    REST API for Dapur Cokelat — a multi-branch bakery management platform.
    Covers authentication, user/role management, inventory, production,
    procurement (purchase orders, deliveries, receipts), sales orders,
    vouchers, payments, and AI queries.

    All protected endpoints require a Bearer token obtained from
    `POST /v1/auth/token`. Pass the token in the `Authorization` header
    as `Bearer <access_token>`.

    **Common query conventions**
    - Pagination: `page` (default 1) and `per_page` (default 10)
    - Eager-loading relations: `include=relation1,relation2`
    - Sorting: `sort=field` for ASC, `sort=-field` for DESC
    - Filtering: `filter[field]=value`
  version: "1.0.0"
  contact:
    name: Dapur Cokelat Engineering

servers:
  - url: "{base_url}"
    description: Configurable base URL (set via environment variable)
    variables:
      base_url:
        default: "https://api.example.com"

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # -------------------------------------------------------------------------
  # Shared parameters
  # -------------------------------------------------------------------------
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: Page number for pagination.
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
      description: Number of items per page.
    SortParam:
      name: sort
      in: query
      schema:
        type: string
      description: >
        Field to sort by. Prefix with `-` for descending order.
        e.g. `id`, `-created_at`.
    IncludeParam:
      name: include
      in: query
      schema:
        type: string
      description: Comma-separated list of relations to eager-load.
    FilterSearchParam:
      name: filter[search]
      in: query
      schema:
        type: string
      description: Keyword search.
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource identifier.

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # Generic envelope
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          description: Payload — shape varies per endpoint.

    PaginatedMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    # Auth
    TokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: superadmin@gmail.com
        password:
          type: string
          format: password
          example: "!AMR00T"

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Expiry in seconds.

    ChangeActiveBranchRequest:
      type: object
      required: [branch_id]
      properties:
        branch_id:
          type: integer
          example: 1

    # AI
    AiQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          example: "what day is it?"

    # Companies
    CompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Albatech

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Branches
    BranchRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: TGR-001F
        name:
          type: string
          example: Alam Sutera
        is_default:
          type: boolean
          example: false

    Branch:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Permissions
    Permission:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time

    # Roles
    RoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: IT
        permission_ids:
          type: array
          items:
            type: integer
          example: [5]

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Users
    UserRequest:
      type: object
      required: [name, email, password]
      properties:
        nik:
          type: string
          example: "32011234567807"
        name:
          type: string
          example: Zulfi
        type:
          type: string
          enum: [superadmin, user]
          example: user
        phone:
          type: string
          example: "1234567890"
        birth:
          type: string
          format: date
          example: "2002-07-07"
        gender:
          type: string
          enum: [male, female]
          example: male
        email:
          type: string
          format: email
          example: zulfsi7@gmail.com
        password:
          type: string
          format: password
          example: password
        branch_ids:
          type: array
          items:
            type: integer
          example: [1]
        role_ids:
          type: array
          items:
            type: integer
          example: [1]

    User:
      type: object
      properties:
        id:
          type: integer
        nik:
          type: string
        name:
          type: string
        type:
          type: string
        phone:
          type: string
        birth:
          type: string
          format: date
        gender:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Product Categories
    ProductCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Book

    # Products
    ProductRequest:
      type: object
      required: [product_category_id, code, name, type]
      properties:
        product_category_id:
          type: integer
          example: 1
        code:
          type: string
          example: KS00002TX
        name:
          type: string
          example: Kue Tart
        type:
          type: string
          enum: [raw, wip, final]
          example: final
        description:
          type: string
          example: Kue enak

    # UOMs
    UomRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: G
        name:
          type: string
          example: Gram

    # Product Conversions
    ProductConversionRequest:
      type: object
      required: [product_id, uom_id, target_uom_id, amount]
      properties:
        product_id:
          type: integer
          example: 1
        uom_id:
          type: integer
          example: 1
        target_uom_id:
          type: integer
          example: 2
        amount:
          type: number
          example: 50

    # Product UOMs
    ProductUomRequest:
      type: object
      required: [product_id, uom_id, code, base_price, online_price]
      properties:
        product_id:
          type: integer
          example: 1
        uom_id:
          type: integer
          example: 4
        code:
          type: string
          example: BRWNS00001
        base_price:
          type: number
          example: 20000
        online_price:
          type: number
          example: 23000
        price_editable:
          type: boolean
          example: false
        is_default:
          type: boolean
          example: false

    # Product Inventories
    ProductInventoryRequest:
      type: object
      required: [product_uom_id, code, base_price, online_price, status]
      properties:
        product_uom_id:
          type: integer
          example: 1
        code:
          type: string
          example: SK00000000001
        base_price:
          type: number
          example: 20000
        online_price:
          type: number
          example: 23000
        price_editable:
          type: boolean
          example: false
        expiry_date:
          type: string
          format: date
          example: "2026-07-07"
        status:
          type: string
          enum: [active, inactive]
          example: active

    ProductInventoryUpdateRequest:
      type: object
      properties:
        code:
          type: string
          example: SK000000000012
        base_price:
          type: number
          example: 20000
        online_price:
          type: number
          example: 23000
        price_editable:
          type: boolean
          example: false
        expiry_date:
          type: string
          format: date
          example: "2026-07-07"
        status:
          type: string
          enum: [active, inactive]
          example: active

    # Stock Movements
    StockMovementRequest:
      type: object
      required: [product_inventory_id, qty, direction]
      properties:
        product_inventory_id:
          type: integer
          example: 3
        qty:
          type: number
          example: 50
        direction:
          type: string
          enum: [in, out]
          example: in
        description:
          type: string
          example: Adjust stock due warehousing fault

    # Recipes
    RecipeMaterialItem:
      type: object
      required: [product_uom_id, qty]
      properties:
        product_uom_id:
          type: integer
          example: 2
        qty:
          type: number
          example: 5

    RecipeRequest:
      type: object
      required: [product_uom_id, qty, is_default, materials]
      properties:
        product_uom_id:
          type: integer
          example: 1
        qty:
          type: number
          example: 2
        is_default:
          type: boolean
          example: true
        materials:
          type: array
          items:
            $ref: '#/components/schemas/RecipeMaterialItem'

    RecipeUpdateRequest:
      type: object
      properties:
        product_id:
          type: integer
        material_product_id:
          type: integer
        material_uom_id:
          type: integer
        qty:
          type: number

    # Productions
    ProductionMaterial:
      type: object
      required: [product_inventory_id, qty]
      properties:
        product_inventory_id:
          type: integer
          example: 1
        qty:
          type: number
          example: 5

    ProductionDetail:
      type: object
      required: [product_uom_id, qty, status]
      properties:
        product_uom_id:
          type: integer
          example: 1
        qty:
          type: number
          example: 30
        expiry_date:
          type: string
          format: date
          example: "2026-07-07"
        status:
          type: string
          enum: [pending, final]
          example: pending
        description:
          type: string
        materials:
          type: array
          items:
            $ref: '#/components/schemas/ProductionMaterial'

    ProductionRequest:
      type: object
      required: [code, date, status, details]
      properties:
        code:
          type: string
          example: PN00002
        date:
          type: string
          format: date
          example: "2026-07-07"
        status:
          type: string
          enum: [pending, final]
          example: pending
        description:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ProductionDetail'

    # Suppliers
    SupplierRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: NGY
        name:
          type: string
          example: Nagoya

    # Purchase Orders
    PurchaseOrderDetail:
      type: object
      required: [product_inventory_id, qty, price]
      properties:
        id:
          type: integer
          description: Provide when updating an existing detail line.
        product_inventory_id:
          type: integer
          example: 1
        qty:
          type: number
          example: 30
        price:
          type: number
          example: 25000
        description:
          type: string

    PurchaseOrderRequest:
      type: object
      required: [code, date, total_price, status, details]
      properties:
        code:
          type: string
          example: PO00001
        supplier_id:
          type: integer
          description: Required if supplier_branch_id is not provided.
          example: 1
        supplier_branch_id:
          type: integer
          description: Required if supplier_id is not provided.
          example: 1
        date:
          type: string
          format: date
          example: "2026-07-07"
        total_price:
          type: number
          example: 2000000
        status:
          type: string
          enum: [pending, final]
          example: pending
        description:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderDetail'

    # Bundles
    BundleDetail:
      type: object
      required: [product_uom_id, qty]
      properties:
        product_uom_id:
          type: integer
          example: 1
        qty:
          type: number
          example: 1

    BundleRequest:
      type: object
      required: [code, name, price, status, details]
      properties:
        code:
          type: string
          example: PARCEL0001
        name:
          type: string
          example: Parsel Lebaran 2026 - Seri 1
        price:
          type: number
          example: 50000
        status:
          type: string
          enum: [active, inactive]
          example: active
        description:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/BundleDetail'

    # Deliveries
    DeliveryDetail:
      type: object
      required: [product_inventory_id, qty, price, status]
      properties:
        product_inventory_id:
          type: integer
          example: 1
        purchase_order_detail_id:
          type: integer
          description: Optional — only when linked to a PO.
          example: 1
        qty:
          type: number
          example: 30
        price:
          type: number
          example: 25000
        status:
          type: string
          enum: [pending, final]
          example: pending
        description:
          type: string

    DeliveryRequest:
      type: object
      required: [code, target_branch_id, date, total_price, status, details]
      properties:
        code:
          type: string
          example: PO00001
        target_branch_id:
          type: integer
          example: 1
        purchase_order_id:
          type: integer
          description: Optional — only when linked to a PO.
          example: 3
        date:
          type: string
          format: date
          example: "2026-07-07"
        total_price:
          type: number
          example: 2000000
        status:
          type: string
          enum: [pending, final]
          example: pending
        description:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryDetail'

    # Receipts
    ReceiptDetail:
      type: object
      required: [product_inventory_id, qty, price, status]
      properties:
        product_inventory_id:
          type: integer
          example: 1
        delivery_detail_id:
          type: integer
          description: Optional — links to a delivery detail line.
          example: 1
        qty:
          type: number
          example: 25
        price:
          type: number
          example: 50000
        status:
          type: string
          enum: [pending, final]
          example: pending
        description:
          type: string
        client_ref:
          type: string
          example: receipts1

    ReceiptRequest:
      type: object
      required: [code, delivery_id, date, status, total_price, details]
      properties:
        code:
          type: string
          example: test2
        delivery_id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2026-03-02"
        status:
          type: string
          enum: [pending, final]
          example: pending
        total_price:
          type: number
          example: 123123
        description:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptDetail'

    # Customers
    CustomerRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          example: test
        phone:
          type: string
          example: "0812313"

    # Vouchers
    VoucherBranch:
      type: object
      required: [branch_id]
      properties:
        branch_id:
          type: integer
          example: 1
        quota:
          type: integer
          example: 300
          description: Optional per-branch quota override.

    VoucherProductUom:
      type: object
      required: [product_uom_id]
      properties:
        product_uom_id:
          type: integer
          example: 1
        quota:
          type: integer
          example: 100
          description: Optional per-product-uom quota override.

    VoucherRequest:
      type: object
      required: [code, name, discount_type, discount_value, scope, valid_from, valid_until, status]
      properties:
        code:
          type: string
          example: PROMO2026
        name:
          type: string
          example: New Year Promotion
        discount_type:
          type: string
          enum: [percent, fixed]
          example: percent
        discount_value:
          type: number
          example: 20
        min_subtotal_price:
          type: number
          example: 100000
        max_discount_price:
          type: number
          example: 50000
        scope:
          type: string
          enum: [company, branch]
          example: branch
        valid_from:
          type: string
          format: date
          example: "2026-01-01"
        valid_until:
          type: string
          format: date
          example: "2027-01-31"
        quota:
          type: integer
          example: 1000
        status:
          type: string
          enum: [active, inactive]
          example: active
        description:
          type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/VoucherBranch'
        product_uoms:
          type: array
          items:
            $ref: '#/components/schemas/VoucherProductUom'

    VoucherStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]
          example: active

    # Sales Orders
    SalesOrderBundleDetail:
      type: object
      required: [product_inventory_id, qty]
      properties:
        product_inventory_id:
          type: integer
          example: 1
        qty:
          type: number
          example: 1

    SalesOrderDetail:
      type: object
      required: [qty, price, status]
      properties:
        product_inventory_id:
          type: integer
          nullable: true
          example: 1
          description: Required when not a bundle item.
        bundle_id:
          type: integer
          nullable: true
          example: null
          description: Required when selling a bundle.
        bundle_details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SalesOrderBundleDetail'
          description: Required when bundle_id is set.
        qty:
          type: number
          example: 2
        price:
          type: number
          example: 3000
        status:
          type: string
          enum: [pending, process, completed]
          example: pending
        description:
          type: string

    SalesOrderRequest:
      type: object
      required: [type, date, subtotal_price, discount_price, total_price, status, details]
      properties:
        code:
          type: string
          example: SO00003
        type:
          type: string
          enum: [offline, online]
          example: offline
        customer_id:
          type: integer
          nullable: true
        customer_name:
          type: string
          example: Zulfi
        customer_phone:
          type: string
          example: "124124123123"
        date:
          type: string
          format: date
          example: "2026-03-11"
        fulfillment_date:
          type: string
          format: date-time
          example: "2026-03-11T09:44:00Z"
        voucher_id:
          type: integer
          nullable: true
        subtotal_price:
          type: number
          example: 12000
        discount_price:
          type: number
          example: 0
        total_price:
          type: number
          example: 12000
        status:
          type: string
          enum: [pending, final]
          example: pending
        settlement_status:
          type: string
          enum: [pending, credit, settled, cancelled]
          example: pending
        credit_by_id:
          type: integer
          nullable: true
          example: 2
        description:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderDetail'

    # Sales Order Bulk Settlement
    SalesOrderSettlementItem:
      type: object
      required: [sales_order_id, settlement_status]
      properties:
        sales_order_id:
          type: integer
          example: 2
        settlement_status:
          type: string
          enum: [pending, credit, settled, cancelled]
          example: credit

    SalesOrderBulkSettlementRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderSettlementItem'

    # Payment Methods
    PaymentMethodRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Cash

    # Payments
    PaymentRequest:
      type: object
      required: [sales_order_id, payment_method_id, amount]
      properties:
        sales_order_id:
          type: integer
          example: 3
        payment_method_id:
          type: integer
          example: 1
        amount:
          type: number
          example: 5000
        description:
          type: string
          example: bayar segini

    PaymentUpdateRequest:
      type: object
      required: [payment_method_id, amount]
      properties:
        payment_method_id:
          type: integer
          example: 1
        amount:
          type: number
          example: 5000
        description:
          type: string
          example: bayar segini

    # Media
    MediaCreateRequest:
      type: object
      required: [media_type, media_id, collection_name, files]
      properties:
        media_type:
          type: string
          enum: [productions, purchase_orders, deliveries, receipts, receipt_details]
          example: receipts
        media_id:
          type: integer
          description: ID of the related resource.
          example: 7
        collection_name:
          type: string
          example: image
        files:
          type: array
          items:
            type: string
            format: binary
          description: One or more files to upload.

    # Dashboard
    DashboardMetricsFilters:
      type: object
      description: Query filters for dashboard metrics.

# ---------------------------------------------------------------------------
# Global security (all endpoints are protected unless overridden)
# ---------------------------------------------------------------------------
security:
  - BearerAuth: []

# ---------------------------------------------------------------------------
# Tags
# ---------------------------------------------------------------------------
tags:
  - name: Auth
    description: Authentication & session management
  - name: AI
    description: AI-powered queries
  - name: Dashboard
    description: Dashboard metrics & insights
  - name: Enums
    description: Enumeration values
  - name: Companies
    description: Company management
  - name: Branches
    description: Branch management
  - name: Permissions
    description: Permission catalogue
  - name: Roles
    description: Role management with permission assignment
  - name: Users
    description: User management
  - name: Media
    description: File / media management
  - name: Product Categories
    description: Product category management
  - name: Products
    description: Product catalogue
  - name: UOMs
    description: Units of measure
  - name: Product Conversions
    description: UOM conversion factors per product
  - name: Product UOMs
    description: Product-UOM combinations with pricing
  - name: Product Inventories
    description: Per-branch inventory items (SKUs)
  - name: Stock Movements
    description: Manual stock adjustments and movement history
  - name: Recipes
    description: Bill-of-materials / recipes for finished goods
  - name: Productions
    description: Production orders
  - name: Suppliers
    description: Supplier management
  - name: Purchase Orders
    description: Procurement purchase orders
  - name: Bundles
    description: Product bundle / package management
  - name: Deliveries
    description: Inbound delivery management
  - name: Receipts
    description: Goods receipt management
  - name: Customers
    description: Customer management
  - name: Vouchers
