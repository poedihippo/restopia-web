# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # =========================================================================
  # AUTH
  # =========================================================================
  /v1/auth/token:
    post:
      tags: [Auth]
      summary: Obtain access & refresh tokens
      description: Authenticates a user with email and password, returning JWT tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens issued successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/token/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Issues a new access token using a valid refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user profile
      parameters:
        - name: include
          in: query
          schema:
            type: string
          example: branch.company
          description: "Available: created_by, updated_by, branch, branch.company, roles, permissions, branches"
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/auth/change-active-branch:
    patch:
      tags: [Auth]
      summary: Switch active branch for current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeActiveBranchRequest'
      responses:
        '200':
          description: Active branch updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/auth/revoke:
    post:
      tags: [Auth]
      summary: Revoke current access token (logout)
      responses:
        '200':
          description: Token revoked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # =========================================================================
  # AI
  # =========================================================================
  /v1/ai/query:
    post:
      tags: [AI]
      summary: Submit a natural language query to the AI assistant
